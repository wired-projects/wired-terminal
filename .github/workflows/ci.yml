name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/wired-backend
      - run: cargo fmt --manifest-path crates/wired-backend/Cargo.toml -- --check
      - run: cargo clippy --manifest-path crates/wired-backend/Cargo.toml -- -D warnings
      # The e2e suite forks a real PTY and stands `shell` in for the agent CLIs,
      # so it needs no login and no network.
      - run: cargo test --manifest-path crates/wired-backend/Cargo.toml

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run install:all
      - run: npm run lint:frontend
      - run: npm run build
