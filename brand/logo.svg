<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Wired Terminal">
  <defs>
    <linearGradient id="bg" x1="18" y1="0" x2="82" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2e1a5f"/>
      <stop offset="1" stop-color="#0a0718"/>
    </linearGradient>
    <linearGradient id="wire" x1="18" y1="35" x2="82" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22.3" fill="url(#bg)"/>
  <rect x="0.7" y="0.7" width="98.6" height="98.6" rx="21.7" stroke="rgba(255,255,255,0.14)" stroke-width="1.1"/>
  <g filter="url(#glow)">
    <path d="M18 47 C26 47 28 76 38 76 C46 76 47 26 50 26 C53 26 54 76 62 76 C72 76 74 47 82 47"
          stroke="url(#wire)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="47" r="4.6" fill="#f1ecff"/>
    <circle cx="50" cy="26" r="4.6" fill="#f1ecff"/>
    <circle cx="82" cy="47" r="4.6" fill="#f1ecff"/>
  </g>
  <!-- product badge: a terminal at a prompt (top-right for dock/taskbar readability) -->
  <g transform="translate(78 22)">
    <circle r="14.5" fill="#180d3a" stroke="rgba(255,255,255,0.22)" stroke-width="1.1"/>
    <rect x="-9" y="-7.6" width="18" height="15.2" rx="2.4" fill="#f1ecff"/>
    <line x1="-9" y1="-4.2" x2="9" y2="-4.2" stroke="#2e1a5f" stroke-width="1.1" opacity="0.38"/>
    <path d="M-5.1 -1 L-2.5 1.5 L-5.1 4" stroke="#2e1a5f" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-0.6" y1="4" x2="5.2" y2="4" stroke="#2e1a5f" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
